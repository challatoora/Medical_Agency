services:

  # =========================
  # USER SERVICE
  # =========================
  user-service:
    build:
      context: ./Backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped

    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: user_db
      DB_PORT: 3306
      ports:
      - "5006:5006"

    

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network


#   # =========================
#   # MEDICINE SERVICE
#   # =========================
  medicine-service:
    build:
      context: ./Backend/medicine-service
      dockerfile: Dockerfile
    container_name: medicine-service
    restart: unless-stopped

    
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017/medical_medicine_db
    ports:
    - "5001:5001"

    expose:
      - "5001"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network


  # =========================
  # INVENTORY SERVICE
  # =========================
  inventory-service:
    build:
      context: ./Backend/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: unless-stopped

    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: cmr_medical
      DB_PORT: 3306
      REDIS_URL: redis://host.docker.internal:6379
    ports:
    - "5003:5003"

    expose:
      - "5003"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network

  # =========================
  # SUPPLIER SERVICE
  # =========================
  supplier-service:
    build:
      context: ./Backend/supplier-service
      dockerfile: Dockerfile
    container_name: supplier-service
    restart: unless-stopped

    environment:
       MONGO_URI: mongodb://host.docker.internal:27017/medical_supplier_db
    ports:
      - "5002:5002"

    expose:
      - "5002"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network


#   # =========================
#   # ORDER SERVICE
#   # =========================
  order-service:
    build:
      context: ./Backend/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped

    ports:
      - "5004:5004"

    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: order_db
      DB_PORT: 3306
    

    expose:
      - "5004"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network


#   # =========================
#   # BILLING SERVICE
#   # =========================
  billing-service:
    build:
      context: ./Backend/billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    restart: unless-stopped

    ports:
      - "5005:5005"

    environment:
      DB_HOST: host.docker.internal
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: billing_db
      DB_PORT: 3306

      

    expose:
      - "5005"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medical-network


#   # =========================
#   # FRONTEND
#   # =========================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: medical-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - user-service
      - medicine-service
      - inventory-service
      - supplier-service
      - order-service
      - billing-service

    networks:
      - medical-network


# # =========================
# # DOCKER NETWORK
# # =========================
networks:
  medical-network:
    name: medical-network
    driver: bridge


